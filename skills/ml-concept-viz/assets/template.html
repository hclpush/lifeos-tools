<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SLOT: Concept — interactive explorer</title>
<style>
/* House variables — shared by every explainer. Keep the names; delete unused groups. */
:root{
  --surface-1:#f4f3ee; --text-primary:#1a1a19; --text-secondary:#52514e; --text-muted:#898781;
  --border:rgba(0,0,0,.12); --border-strong:rgba(0,0,0,.22); --border-stronger:rgba(0,0,0,.4);
  --border-accent:#2a78d6;
  /* status tints — metric cards, confusion cells */
  --bg-success:#e3f2e3; --text-success:#1d6a1d; --bg-danger:#fbe4e4; --text-danger:#a32d2d;
  --bg-warning:#faeeda; --text-warning:#854f0b;
  /* validated palettes — see SKILL.md Step 3 before changing */
  --tp:#1baf7a; --fp:#e34948; --fn:#eda100; --tn:#8a8880;  /* classification states */
  --c1:#2a78d6; --c2:#e34948;                              /* two-series lines */
  --font-mono:ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root{
    --surface-1:#262624; --text-primary:#f5f4ef; --text-secondary:#c3c2b7; --text-muted:#898781;
    --border:rgba(255,255,255,.12); --border-strong:rgba(255,255,255,.25); --border-stronger:rgba(255,255,255,.4);
    --border-accent:#3987e5;
    --bg-success:#1e3a1e; --text-success:#8fd48f; --bg-danger:#452020; --text-danger:#f09595;
    --bg-warning:#41300f; --text-warning:#fac775;
    --tp:#199e70; --fp:#e66767; --fn:#c98500; --tn:#9a9890;
    --c1:#3987e5; --c2:#e66767;
  }
  body{background:#1a1a19}
}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text-primary);max-width:720px;margin:0 auto;padding:24px 16px 60px;line-height:1.6}
h1{font-size:22px;font-weight:600;margin:0 0 4px}
.sub{font-size:14px;color:var(--text-secondary);margin:0 0 20px}
button{font:inherit;font-size:13px;padding:6px 14px;border:1px solid var(--border-strong);border-radius:8px;background:transparent;color:var(--text-primary);cursor:pointer}
button:hover{background:var(--surface-1)}
input[type=range]{accent-color:var(--text-primary)}
.lg{display:flex;align-items:center;gap:6px}  /* legend item */
.dot{width:11px;height:11px;border-radius:50%;flex:none;box-sizing:border-box}  /* dot swatch: background = filled series, border = hollow series */
.sw{width:20px;height:0;flex:none}  /* line swatch: style with border-top, solid or dashed */
.mc{background:var(--surface-1);border-radius:8px;padding:10px 14px}  /* metric card */
</style>
</head>
<body>
<h1>SLOT: concept title</h1>
<p class="sub">SLOT: 2–3 sentences — what the learner is looking at, what to drag, and what to watch happen.</p>

<!-- Legend row — one .lg per series; color + a secondary encoding, never color alone -->
<div style="display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--text-secondary);margin:0 0 6px;">
<span class="lg"><span class="dot" style="background:var(--c1)"></span>SLOT: series A</span>
<span class="lg"><span class="sw" style="border-top:2px dashed var(--c2);"></span>SLOT: series B</span>
</div>

<!-- Main SVG — scene built by JS below; describe the whole scene in aria-label -->
<svg viewBox="0 0 660 260" width="100%" role="img" aria-label="SLOT: what the chart shows, for screen readers">
</svg>

<!-- Slider row -->
<div style="display:flex;align-items:center;gap:12px;margin:8px 0 8px;">
<label for="ctl" style="font-size:14px;color:var(--text-secondary);white-space:nowrap;">SLOT: control name</label>
<input type="range" id="ctl" min="0" max="100" value="50" step="1" style="flex:1;">
<span id="ctlo" style="font-size:14px;font-weight:500;min-width:38px;text-align:right;">–</span>
</div>

<!-- Preset buttons — jump to the teaching extremes -->
<div style="display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px;">
<button id="b1">SLOT: extreme 1</button>
<button id="b2">SLOT: sweet spot</button>
<button id="b3">SLOT: extreme 2</button>
</div>

<!-- Metric cards — live formula with actual numbers, e.g. "TP / (TP + FP) = 22 / (22 + 8) = 0.73" -->
<div style="display:grid;gap:8px;">
<div class="mc">
<div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;">
<span style="font-size:13px;color:var(--text-secondary);">SLOT: metric — the plain-words question it answers</span>
<span id="m1v" style="font-size:20px;font-weight:500;">–</span>
</div>
<div style="font-size:12px;color:var(--text-muted);font-family:var(--font-mono);">SLOT: formula = <span id="m1f"></span></div>
</div>
</div>

<!-- SLOT (optional): second chart + its own legend row, e.g. the metric-vs-control curve -->

<script>
(function(){
/* mulberry32 — seeded PRNG. Same seed and generation code as the Node validation run. */
function mul(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
var rnd=mul(7); /* SLOT: the seed that passed validation */
/* pseudo-gaussian, sd ≈ 0.289 (NOT 1) — scale noise multipliers accordingly */
function g(){return (rnd()+rnd()+rnd()+rnd()-2)/2}
function clamp(v,lo,hi){return Math.max(lo,Math.min(hi,v))}

/* SVG helpers */
var NS='http://www.w3.org/2000/svg';
function el(id){return document.getElementById(id)}
function mk(tag,at,parent){var e=document.createElementNS(NS,tag);for(var k in at)e.setAttribute(k,at[k]);parent.appendChild(e);return e}

/* SLOT: generate data — identical code to the Node validation script */

/* SLOT: static scene — axes, ticks, gridlines, fixed curves (draw once) */

/* SLOT: update() — recompute everything from the slider value, restyle marks, rewrite metric cards.
   toFixed every displayed number; undefined metrics (0/0) show "—" plus a one-line reason. */
function update(){
var t=+el('ctl').value/100;
el('ctlo').textContent=t.toFixed(2);
}

el('ctl').addEventListener('input',update);
/* SLOT: preset handlers — compute the target value, set the slider, call update() */
el('b1').onclick=function(){el('ctl').value=0;update()};
el('b3').onclick=function(){el('ctl').value=100;update()};
update();
})();
</script>
</body>
</html>
